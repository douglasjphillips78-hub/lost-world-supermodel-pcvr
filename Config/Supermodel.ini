; Supermodel VR (PC) settings - The Lost World.
; Light guns are driven like a mouse, the same way desktop Supermodel plays them with a
; mouse or the Steam Deck touchpad: in VR the controller you shoot with becomes that mouse.

[ Global ]
New3DEngine = 1
MultiThreaded = 1
GPUMultiThreaded = 1
RefreshRate = 60
Crosshairs = 0
ShowFrameRate = 0

; --- VR tuning (used with -vr) ---
VRWorldUnitsPerMeter = 1.0
VRPositionalTracking = 1
VRHudDistance = 20.0
; Lower (0.7 - 0.9) is the biggest single help for frame rate; 1.0 is full size.
VRResolutionScale = 0.8
VRMaxEyeWidth = 1280
; Headset refresh: the highest rate offered up to this value (Quest: 72, 90 or 120). Lower = less GPU work per second.
; Star Wars on a Quest needs the lower end: 72 is a good start.
VRRefreshHz = 72
; The Lost World draws no crosshair of its own, so VR shows a pointer ring where you aim
VRPointer = 1
VRHideLetterbox = 1
VRMirror = 1
VRAsyncFrames = 1
; Score, timer and on-screen text: 2 = follow your head during play and cutscenes, stay
; fixed in the room on menus and title screens; 1 = always follow the head; 0 = always fixed
VRHudLock = 2
; 1 = hide player 2's "PRESS START BUTTON" in the corner during play (single player)
VRHideP2Prompt = 1
; 1 = when you're hit, the game's "static" and full-screen fades fill your whole view, not just the 4:3 screen
VRStaticFill = 1
; 1 = the game's background (sky) continues past the 4:3 screen, mirrored at its edges
VRBackdropFill = 1
; Flight-stick games (Star Wars Trilogy): thumbsticks steer. VRStickInvertY = 1 flips up/down.
VRStickInvertY = 0
VRStickDeadZone = 0.08
; VRStickMode: 0 = point the right controller at the screen to steer (like a light gun; trigger fires,
; grip = second button), 1 = thumbsticks. VRStickAimRange: how far from the screen centre you point
; for full stick (0.5 = the screen edge; smaller = more sensitive).
VRStickMode = 0
VRStickAimRange = 0.5
; Light-sabre sections: HOLD the trigger of your non-aiming (left) hand for about half a second to steer with the
; right thumbstick instead of pointing; hold it again to go back to pointing. That hand buzzes: long = thumbstick.
; VRSaberStart = 1 starts in thumbstick mode. VRSaberHoldMs = how long to hold.
VRSaberStart = 0
VRSaberHoldMs = 600
; The options below can also be changed in the headset (left controller's menu button).
VRVignette = 2
VRCinema = 0
VRCinemaSize = 1
VRCinemaDepth = 2
VRCinemaGlow = 1
VRCinemaBezel = 1
VRGunHand = 1
; Gun model in your hand: 0 off, 1 the game's rifle, 4 the game's pistol (both read from your ROM),
; 2 your own (Assets/VRGunModel.obj), 3 an arcade gun (Assets/VRGameGun.obj, blue or red)
VRGunModel = 1
VRRecoil = 1
VRAimNudgeX = 0.00
VRAimNudgeY = 0.00
VRHudFilter = 1
; Gun correction (The Lost World): gun position = where you point * scale + offset, so the
; game's red dot lands exactly where the controller points. The VR build sets the game's gun
; calibration to the middle half of the gun's range (see VRGunCalibration), so the game aims
; about a screen-width past each edge of its 4:3 screen - hence scale ~0.55.
VRAimScaleX = 0.5497
VRAimOffsetX = 0.2162
VRAimScaleY = 0.5507
VRAimOffsetY = 0.2155

; --- Inputs ---
InputStart1 = "KEY_1,JOY1_BUTTON9"
InputCoin1 = "KEY_3,JOY1_BUTTON10"
InputServiceA = "KEY_0"
InputTestA = "KEY_9"
InputAnalogGunX = "MOUSE_XAXIS"
InputAnalogGunY = "MOUSE_YAXIS"
InputAnalogTriggerLeft = "MOUSE_LEFT_BUTTON"
InputAnalogTriggerRight = "MOUSE_RIGHT_BUTTON"
